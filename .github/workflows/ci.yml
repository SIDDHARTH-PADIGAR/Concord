name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tooling
        run: pip install -r requirements-dev.txt

      - name: Install concord-core (editable)
        run: pip install -e ./libs/concord-core

      - name: Install concord-worker (editable)
        run: pip install -e ./services/worker

      - name: Install concord-reconciler (editable)
        run: pip install -e ./services/reconciler

      - name: ruff format --check
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      - name: mypy
        run: mypy libs/concord-core/src services/worker/src services/reconciler/src

      - name: pytest (unit)
        run: pytest

  integration:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: concord
          POSTGRES_PASSWORD: concord_dev_password
          POSTGRES_DB: concord
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concord"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tooling
        run: pip install -r requirements-dev.txt

      - name: Install concord-core (editable)
        run: pip install -e ./libs/concord-core

      - name: Install concord-worker (editable)
        run: pip install -e ./services/worker

      - name: Install concord-reconciler (editable)
        run: pip install -e ./services/reconciler

      - name: pytest (integration)
        env:
          CONCORD_DB_HOST: localhost
          CONCORD_DB_PORT: "5432"
          CONCORD_DB_USER: concord
          CONCORD_DB_PASSWORD: concord_dev_password
          CONCORD_DB_NAME: concord
          CONCORD_REDIS_HOST: localhost
          CONCORD_REDIS_PORT: "6379"
        run: pytest -m integration -v