services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord_dev_password
      POSTGRES_DB: concord
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U concord -d concord"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      CONCORD_REDIS_HOST: redis
      CONCORD_REDIS_PORT: 6379
      CONCORD_DB_HOST: timescaledb
      CONCORD_DB_PORT: 5432
      CONCORD_DB_USER: concord
      CONCORD_DB_PASSWORD: concord_dev_password
      CONCORD_DB_NAME: concord
      CONCORD_WORKER_CONSUMER_NAME: worker-1
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb_data: